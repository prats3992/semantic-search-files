[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-files"
version = "1.2.0"
description = "Search, tag, and organize local files by meaning using sentence embeddings and FAISS."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pratham Arora" }]
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "yake>=0.4",
    "python-dotenv>=1.0",
    "python-docx>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
semsearch = "semantic_search.cli:main"

[tool.setuptools.packages.find]
include = ["semantic_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
